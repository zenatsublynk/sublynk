<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How did you find Sublynk?</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --orange:#DD6336; --orange-ink:#B84E27; --navy:#0D142A;
    --bg:#F7F5F2; --card:#FFFFFF; --ink:#0D142A; --muted:#5B6472;
    --line:#E7E3DD; --line-strong:#D8D2C8; --tint:#FBEEE7; --ring:rgba(221,99,54,.28);
    --shadow:0 1px 2px rgba(13,20,42,.05), 0 12px 30px rgba(13,20,42,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0B1020; --card:#141B30; --ink:#EEF1F7; --muted:#9AA3B4;
      --line:#232C44; --line-strong:#2E3A56; --tint:#2A1C14; --ring:rgba(221,99,54,.4);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.45); }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 480px at 50% -10%, color-mix(in srgb, var(--orange) 12%, transparent), transparent 70%),
      var(--bg);
    color:var(--ink); min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:24px 18px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:540px}
  .brand{display:flex; align-items:center; gap:9px; justify-content:center; margin-bottom:22px}
  .brand .dot{width:11px; height:11px; border-radius:50%; background:var(--orange); box-shadow:0 0 0 4px var(--tint)}
  .brand .word{font-weight:800; letter-spacing:-.02em; font-size:19px; color:var(--ink)}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:28px 26px 24px; box-shadow:var(--shadow);
  }
  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--orange-ink); margin:0 0 8px}
  @media (prefers-color-scheme: dark){ .eyebrow{color:#F0A07E} }
  h1{font-size:23px; line-height:1.2; letter-spacing:-.02em; margin:0 0 6px; font-weight:800; text-wrap:balance}
  .sub{color:var(--muted); font-size:14.5px; margin:0 0 20px}
  .opts{display:grid; gap:9px; margin:0 0 18px}
  .opt{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
    background:var(--card); border:1.5px solid var(--line-strong); border-radius:13px;
    padding:13px 14px; font:inherit; color:var(--ink); transition:border-color .12s, background .12s, transform .04s;
  }
  .opt:hover{border-color:var(--orange)}
  .opt:active{transform:translateY(1px)}
  .opt .emo{font-size:19px; line-height:1; width:24px; text-align:center; flex:none}
  .opt .lab{font-weight:600; font-size:15px}
  .opt[aria-pressed="true"]{border-color:var(--orange); background:var(--tint); box-shadow:0 0 0 3px var(--ring)}
  .opt .tick{margin-left:auto; width:20px; height:20px; border-radius:50%; border:2px solid var(--line-strong); flex:none; position:relative}
  .opt[aria-pressed="true"] .tick{border-color:var(--orange); background:var(--orange)}
  .opt[aria-pressed="true"] .tick::after{content:""; position:absolute; inset:0; margin:auto; width:6px; height:10px; border:2px solid #fff; border-top:0; border-left:0; transform:rotate(45deg); top:-1px}
  .more{display:grid; gap:11px; margin:2px 0 18px}
  label.fld{display:grid; gap:6px; font-size:12.5px; font-weight:600; color:var(--muted)}
  input[type=text], input[type=email]{
    font:inherit; font-size:15px; color:var(--ink); background:var(--card);
    border:1.5px solid var(--line-strong); border-radius:11px; padding:11px 13px; width:100%;
  }
  input::placeholder{color:color-mix(in srgb, var(--muted) 72%, transparent)}
  input:focus-visible{outline:none; border-color:var(--orange); box-shadow:0 0 0 3px var(--ring)}
  .hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
  .btn{
    width:100%; border:0; border-radius:13px; cursor:pointer; font:inherit; font-weight:700; font-size:15.5px;
    color:#fff; background:var(--orange); padding:14px 16px; letter-spacing:.01em;
    box-shadow:0 8px 20px rgba(221,99,54,.28); transition:filter .12s, transform .04s, opacity .12s;
  }
  .btn:hover{filter:brightness(1.04)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.55; cursor:default; box-shadow:none}
  .note{margin:12px 2px 0; font-size:12px; color:var(--muted); text-align:center}
  .err{display:none; margin:12px 0 0; font-size:13.5px; color:#B84E27; font-weight:600; text-align:center}
  @media (prefers-color-scheme: dark){ .err{color:#F0A07E} }
  /* thank-you */
  .done{display:none; text-align:center; padding:14px 6px 8px}
  .done .ring{width:60px; height:60px; border-radius:50%; margin:0 auto 16px; background:var(--tint); display:grid; place-items:center}
  .done .ring::after{content:""; width:16px; height:28px; border:4px solid var(--orange); border-top:0; border-left:0; transform:rotate(45deg); margin-top:-6px}
  .done h2{font-size:21px; margin:0 0 6px; letter-spacing:-.02em}
  .done p{color:var(--muted); margin:0 auto; max-width:340px; font-size:14.5px}
  .reveal{animation:fade .25s ease both}
  @keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="dot"></span><span class="word">sublynk</span></div>

    <div class="card" id="card">
      <div id="form">
        <p class="eyebrow">One quick thing</p>
        <h1>How did you find Sublynk?</h1>
        <p class="sub">It genuinely helps us reach more contractors like you. Takes about 10 seconds.</p>

        <div class="opts" id="opts" role="group" aria-label="How did you hear about us">
          <button type="button" class="opt" data-src="Job alert email"><span class="emo">📬</span><span class="lab">A job alert email from Sublynk</span><span class="tick"></span></button>
          <button type="button" class="opt" data-src="Network / GC invited me"><span class="emo">🤝</span><span class="lab">A network or GC invited me</span><span class="tick"></span></button>
          <button type="button" class="opt" data-src="Google / web search"><span class="emo">🔍</span><span class="lab">Google or a web search</span><span class="tick"></span></button>
          <button type="button" class="opt" data-src="Referral / word of mouth"><span class="emo">💬</span><span class="lab">A friend told me / referral</span><span class="tick"></span></button>
          <button type="button" class="opt" data-src="LinkedIn"><span class="emo">💼</span><span class="lab">LinkedIn</span><span class="tick"></span></button>
          <button type="button" class="opt" data-src="Facebook / Instagram"><span class="emo">📱</span><span class="lab">Facebook or Instagram</span><span class="tick"></span></button>
          <button type="button" class="opt" data-src="Sublynk profile / job board"><span class="emo">🧾</span><span class="lab">Saw a Sublynk profile or the job board</span><span class="tick"></span></button>
          <button type="button" class="opt" data-src="Other"><span class="emo">✨</span><span class="lab">Something else</span><span class="tick"></span></button>
        </div>

        <div class="more">
          <label class="fld" id="otherWrap" style="display:none">Tell us a bit more
            <input type="text" id="detail" placeholder="Where exactly did you hear about us?" maxlength="240" autocomplete="off">
          </label>
          <label class="fld">Company <span style="font-weight:500">(optional — helps us match your account)</span>
            <input type="text" id="company" placeholder="Your company name" maxlength="120" autocomplete="organization">
          </label>
          <label class="fld">Email <span style="font-weight:500">(optional)</span>
            <input type="email" id="email" placeholder="you@company.com" maxlength="150" autocomplete="email">
          </label>
        </div>
        <input type="text" class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button class="btn" id="submit" disabled>Pick one to continue</button>
        <p class="err" id="err">Something went wrong. Please try again.</p>
        <p class="note">Sublynk · helping contractors get found and get to work</p>
      </div>

      <div class="done" id="done">
        <div class="ring"></div>
        <h2>Thank you 🙌</h2>
        <p>That's a real help. Now back to finding you work.</p>
      </div>
    </div>
  </div>

<script>
(function(){
  var WORKER = 'https://sublynk-consent-worker.zen-426.workers.dev/api/hear';
  var chosen = null;
  var opts = document.getElementById('opts');
  var btn = document.getElementById('submit');
  var otherWrap = document.getElementById('otherWrap');
  var err = document.getElementById('err');

  // The campaign/link that drove them here (job-alert CTA can append ?ref=joballerts-t1, etc.).
  var qs = new URLSearchParams(location.search);
  var ref = qs.get('ref') || qs.get('src') || qs.get('utm_campaign') || qs.get('utm_source') || '';

  opts.addEventListener('click', function(e){
    var b = e.target.closest('.opt'); if(!b) return;
    Array.prototype.forEach.call(opts.children, function(o){ o.setAttribute('aria-pressed','false'); });
    b.setAttribute('aria-pressed','true');
    chosen = b.getAttribute('data-src');
    otherWrap.style.display = (chosen === 'Other') ? 'grid' : 'none';
    btn.disabled = false;
    btn.textContent = 'Send';
  });

  btn.addEventListener('click', function(){
    if(!chosen) return;
    if(document.getElementById('website').value){ show(); return; } // honeypot -> silently succeed
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Sending…';
    var payload = {
      source: chosen,
      detail: (document.getElementById('detail').value || '').trim(),
      company: (document.getElementById('company').value || '').trim(),
      email: (document.getElementById('email').value || '').trim(),
      ref: ref,
      website: ''
    };
    fetch(WORKER, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
      .then(function(r){ if(!r.ok) throw new Error('bad'); return r.json(); })
      .then(function(){ show(); })
      .catch(function(){
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Send';
      });
  });

  function show(){
    document.getElementById('form').style.display = 'none';
    var d = document.getElementById('done');
    d.style.display = 'block'; d.classList.add('reveal');
  }
})();
</script>
</body>
</html>
